[package]
name = "localsend-mcp-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "0.1", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
localsend = "0.1"
anyhow = "1.0.104"
axum = "0.8.9"
